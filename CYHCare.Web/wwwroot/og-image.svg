    <path d="M50 82 S20 52 20 34 A18 18 0 0 1 50 25 A18 18 0 0 1 80 34 C80 52 50 82 50 82 Z" fill="#f43f5e" />
  </g>
  
  <!-- Brand Text -->
  <text x="220" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff">CYH <tspan fill="#38bdf8">Care</tspan></text>
  <text x="220" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f43f5e" letter-spacing="4">PEOPLE HELP PEOPLE</text>
  
  <!-- Main Emotional Slogan -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff">No One Should Face the Hospital Alone.</text>
  
