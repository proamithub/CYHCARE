  <text x="130" y="552" font-family="sans-serif" font-size="20" font-weight="600" fill="#22c55e">&#x2713; 100% Verified Helpers</text>
  
  <rect x="400" y="520" width="260" height="50" rx="25" fill="#ffffff" fill-opacity="0.15" />
  <text x="430" y="552" font-family="sans-serif" font-size="20" font-weight="600" fill="#38bdf8">&#x25C9; 100m Live Geofence</text>
  
  <rect x="680" y="520" width="280" height="50" rx="25" fill="#ffffff" fill-opacity="0.15" />
  <text x="710" y="552" font-family="sans-serif" font-size="20" font-weight="600" fill="#fbbf24">&#x2605; 4.9/5 Compassion Score</text>
